name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so two runs cannot choose the same next version.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install musl and Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Test and build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
          "target/$TARGET/release/rmtrash" --help > /dev/null

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/rmtrash-$TARGET.tar.gz" -C "target/$TARGET/release" rmtrash

      - uses: actions/upload-artifact@v4
        with:
          name: rmtrash-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: rmtrash-*
          path: dist
          merge-multiple: true

      - name: Choose next release tag
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          versions = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag))
          ]
          major, minor, patch = max(versions, default=(0, 0, 0))
          tag = f"v{major}.{minor}.{patch + 1}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          print(f"Next release: {tag}")
          PY

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      # gh creates the tag at this run's commit, rather than the latest main.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
